<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your dashboard · Account Studio</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <nav class="wrap">
        <a class="brand" th:href="@{/}">Account Studio<span> /</span></a>
        <div class="links">
          <a th:href="@{/login}">Sign in</a><a th:href="@{/register}">Create account</a>
        </div>
      </nav>
    </header>
    <main id="main" class="wrap">
      <section class="hero">
        <span class="eyebrow">Your workspace</span>
        <h1>Hello, <span th:text="${profile.firstName}">member</span>.</h1>
        <p class="lead">You’re signed in. Here’s a snapshot of your account.</p>
      </section>
      <section class="section card">
        <div class="section-title">
          <h2>Account profile</h2>
          <span class="badge" th:text="${profile.role}">USER</span>
        </div>
        <dl class="profile-grid">
          <div>
            <dt>Name</dt>
            <dd>
              <span th:text="${profile.firstName}"></span>
              <span th:text="${profile.lastName}"></span>
            </dd>
          </div>
          <div>
            <dt>Email address</dt>
            <dd th:text="${profile.email}"></dd>
          </div>
        </dl>
        <div class="actions">
          <a class="button secondary" th:if="${profile.role == 'ADMIN'}" th:href="@{/users}"
            >View member directory →</a
          >
          <form method="post" th:action="@{/logout}"><button type="submit">Sign out</button></form>
        </div>
      </section>
    </main>
    <footer>
      <div class="wrap">
        <span>Built by Shafeeq · Java & Spring Security</span
        ><span>A foundation for secure account experiences.</span>
      </div>
    </footer>
  </body>
</html>
